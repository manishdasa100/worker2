# ===========================================================================
# worker2 RUN profile — jail for executing untrusted USER CODE.
#
# Boundary summary (defense in depth):
#   * namespaces: user, net (NO network), pid, mount, ipc, uts
#   * rootfs: tmpfs /, the workspace read-only at /code, the language's toolchain
#     paths read-only (none for static binaries), fake /etc/passwd and /etc/group,
#     /dev with null, zero and urandom only, a fresh /tmp; no /proc, no /sys
#   * every rlimit set explicitly + cgroup (memory, pids) bound CPU/mem/procs/fds/file size
#   * seccomp: the allowlist in run.kafel. Unlisted syscalls return ENOSYS,
#     dangerous ones (ptrace, mount, unshare, bpf, ...) kill the process,
#     threads only (fork returns EAGAIN), no sockets.
#
# The executor overrides --rlimit_cpu / --time_limit / --rlimit_stack per run.
# ===========================================================================

name: "codinglemons-run"
description: "Run untrusted user code (seccomp allowlist, threads only)"

mode: ONCE
hostname: "sandbox"
cwd: "/code"

# Wall-clock backstop; the executor overrides it to a second above its watchdog
# (which kills at 2 x CPU limit + 1 s).
time_limit: 60
max_cpus: 1

# --- rlimits (VALUE = use the number; HARD/SOFT would ignore it) ---
# Virtual address space: generous on purpose — the executor's memory watch is the
# real RSS limit; rlimit_as only caps unbacked virtual mappings and too-tight
# a value breaks the JVM's heap+metaspace+stack reservations.
rlimit_as_type: VALUE
rlimit_as: 4096
rlimit_cpu_type: VALUE
rlimit_cpu: 10
rlimit_nofile_type: VALUE
rlimit_nofile: 256
rlimit_fsize_type: VALUE
rlimit_fsize: 64
rlimit_nproc_type: VALUE
rlimit_nproc: 64
rlimit_core_type: VALUE
rlimit_core: 0
# Overridden to the memory limit, so deep recursion runs until memory runs out.
rlimit_stack_type: VALUE
rlimit_stack: 8
rlimit_memlock_type: VALUE
rlimit_memlock: 0
rlimit_rtprio_type: VALUE
rlimit_rtprio: 0
rlimit_msgqueue_type: VALUE
rlimit_msgqueue: 0

# --- cgroups: none here. The executor puts nsjail in a per-jail cgroup
# (memory, cpuacct, pids) itself; see cgroups.py. CPU is bounded by
# max_cpus + rlimit_cpu + the wall backstop.

# --- namespaces ---
clone_newnet: true
iface_no_lo: true               # no loopback either; gVisor rejects bringing lo up (ENOTTY)
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: false          # gVisor rejects CLONE_NEWCGROUP (EINVAL)

# Identity: the executor passes --user/--group 1000:<JAIL_UID>:1, mapping the
# jail's one user ("jail" in sandbox/passwd) to the slot's host uid, never to root.

# --- filesystem: no /proc, no /sys. The executor adds the language's read-only
# toolchain (read-only paths, extra variables) and the job's workspace at /code.
mount { dst: "/" fstype: "tmpfs" rw: false }
mount { src: "/opt/executor/sandbox/passwd" dst: "/etc/passwd" is_bind: true rw: false }
mount { src: "/opt/executor/sandbox/group" dst: "/etc/group" is_bind: true rw: false }
mount { dst: "/dev" fstype: "tmpfs" nosuid: true rw: false }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/zero" dst: "/dev/zero" is_bind: true rw: false }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: false }
# Fresh per jail; gVisor charges what is written here to the jail's memory.
mount { dst: "/tmp" fstype: "tmpfs" nosuid: true rw: true }

envar: "PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C.UTF-8"

silent: false
skip_setsid: false
disable_no_new_privs: false

seccomp_policy_file: "/opt/executor/sandbox/run.kafel"
