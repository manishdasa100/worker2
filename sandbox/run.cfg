# ===========================================================================
# worker2 RUN profile — jail for executing untrusted USER CODE.
#
# Boundary summary (defense in depth):
#   * namespaces: user, net (NO network), pid, mount, ipc, uts, cgroup
#   * rootfs: tmpfs /, host /usr read-only (toolchain/libs), /tmp tmpfs rw,
#     /proc with sensitive dirs masked, /dev minimal
#   * rlimits + cgroup (memory, pids) bound CPU/mem/procs/fds/file size
#   * seccomp: DEFAULT KILL_PROCESS with a tested allow-list (default-deny).
#     Everything dangerous (ptrace, mount, module load, bpf, kexec, keyctl,
#     userfaultfd, io_uring, unshare, setns, pivot_root, chroot, swapon, ...)
#     is absent from the allow-list and so kills the process.
#
# The worker overrides --rlimit_cpu / --time_limit / --cgroup_mem_max per run.
# ===========================================================================

name: "codinglemons-run"
description: "Run untrusted user code (default-deny seccomp)"

mode: ONCE
hostname: "sandbox"
cwd: "/code"

# Wall-clock backstop (worker overrides to CPU-limit + grace). TLE itself is
# judged on the cgroup CPU counter, not this.
time_limit: 60
max_cpus: 1

# --- rlimits (VALUE = use the number; HARD/SOFT would ignore it) ---
# Virtual address space: generous on purpose — the cgroup memory.max is the
# real RSS limit; rlimit_as only caps unbacked virtual mappings and too-tight
# a value breaks the JVM's heap+metaspace+stack reservations.
rlimit_as_type: VALUE
rlimit_as: 4096
rlimit_cpu_type: VALUE
rlimit_cpu: 10
rlimit_nofile_type: VALUE
rlimit_nofile: 256
rlimit_fsize_type: VALUE
rlimit_fsize: 64
rlimit_nproc_type: VALUE
rlimit_nproc: 64
rlimit_core_type: VALUE
rlimit_core: 0

# --- cgroup v2 (rootless; worker passes --cgroupv2_mount per run) ---
use_cgroupv2: true
cgroup_mem_max: 268435456
cgroup_pids_max: 64
# CPU-bandwidth throttle intentionally OFF: the limit semantic is CPU time,
# and a throttle would only apply where the cpu controller is delegated,
# skewing TLE between hosts. CPU is bounded by max_cpus + rlimit_cpu + the
# wall backstop.
cgroup_cpu_ms_per_sec: 0

# --- namespaces ---
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

uidmap { inside_id: "65534" outside_id: "" count: 1 }
gidmap { inside_id: "65534" outside_id: "" count: 1 }

# --- filesystem ---
mount { dst: "/" fstype: "tmpfs" rw: false }
mount { src: "/usr" dst: "/usr" is_bind: true nosuid: true rw: false }
mount { src: "/usr/lib" dst: "/lib" is_symlink: true }
mount { src: "/usr/lib64" dst: "/lib64" is_symlink: true }
mount { src: "/usr/lib32" dst: "/lib32" is_symlink: true }
mount { src: "/usr/libx32" dst: "/libx32" is_symlink: true }
mount { src: "/usr/bin" dst: "/bin" is_symlink: true }
mount { src: "/usr/sbin" dst: "/sbin" is_symlink: true }
mount { dst: "/proc" fstype: "proc" nosuid: true rw: false }
# Mask /proc dirs that leak host info (tmpfs can only mask dirs, not files).
mount { dst: "/proc/bus" fstype: "tmpfs" rw: false }
mount { dst: "/proc/irq" fstype: "tmpfs" rw: false }
mount { dst: "/proc/sys" fstype: "tmpfs" rw: false }
mount { dst: "/proc/scsi" fstype: "tmpfs" rw: false }
mount { dst: "/dev" fstype: "tmpfs" nosuid: true rw: false }
mount { dst: "/tmp" fstype: "tmpfs" nosuid: true rw: true }

envar: "PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C.UTF-8"

silent: false
skip_setsid: false
disable_no_new_privs: false

# ===========================================================================
# SECCOMP — DEFAULT KILL_PROCESS (allow-list / default-deny)
#
# The allow-list is the measured union of what python3, the g++-compiled
# binary, and the JVM use (strace), plus their common safe siblings. Network
# syscalls are allowed but neutered by the empty net namespace, so a program
# attempting network fails gracefully (as measured) instead of being killed.
# set*id and execveat return EPERM (graceful) rather than killing.
#
# ponytail: nested-userns ceiling — clone3 (JVM threads) can't be flag-filtered
# by seccomp (args are behind a struct pointer), so creating a NESTED user
# namespace isn't blocked here. It is non-escalating (no host capabilities),
# and unshare/setns ARE killed. Prod upgrade path: set sysctl
# user.max_user_namespaces=0 (or kernel.unprivileged_userns_clone=0) on the host.
# ===========================================================================
seccomp_string:
  "POLICY codinglemons_run { "
    "ERRNO(1) { "
      "setuid, setgid, setreuid, setregid, setresuid, setresgid, "
      "setfsuid, setfsgid, setgroups, execveat, ptrace, personality "
    "}, "
    "ALLOW { "
      "read, write, readv, writev, pread64, pwrite64, preadv, pwritev, "
      "preadv2, pwritev2, open, openat, openat2, close, close_range, "
      "newfstatat, statx, statfs, fstatfs, lseek, "
      "dup, dup2, dup3, pipe, pipe2, fcntl, flock, ftruncate, fallocate, "
      "getdents64, getcwd, chdir, fchdir, access, faccessat, faccessat2, "
      "readlink, readlinkat, umask, rename, renameat, renameat2, "
      "mkdir, mkdirat, unlink, unlinkat, rmdir, link, linkat, symlink, "
      "symlinkat, chmod, fchmod, fchmodat, utimensat, truncate, "
      "sync, fsync, fdatasync, syncfs, memfd_create, "
      "mmap, munmap, mprotect, mremap, madvise, brk, mlock, munlock, "
      "mlockall, munlockall, msync, mincore, "
      "clone, clone3, fork, vfork, execve, exit, exit_group, wait4, waitid, "
      "futex, futex_waitv, set_robust_list, get_robust_list, set_tid_address, "
      "gettid, getpid, getppid, getrandom, rseq, restart_syscall, "
      "rt_sigaction, rt_sigprocmask, rt_sigreturn, rt_sigpending, "
      "rt_sigtimedwait, rt_sigsuspend, rt_sigqueueinfo, sigaltstack, "
      "kill, tgkill, tkill, pause, "
      "nanosleep, clock_nanosleep, clock_gettime, clock_getres, "
      "gettimeofday, times, time, "
      "getuid, geteuid, getgid, getegid, getgroups, getresuid, getresgid, "
      "arch_prctl, prctl, prlimit64, getrlimit, getrusage, sysinfo, newuname, "
      "sched_getaffinity, sched_setaffinity, sched_yield, sched_getparam, "
      "sched_getscheduler, sched_get_priority_max, sched_get_priority_min, "
      "getpriority, setpriority, capget, "
      "ioctl, poll, ppoll, select, pselect6, "
      "epoll_create, epoll_create1, epoll_ctl, epoll_wait, epoll_pwait, "
      "eventfd, eventfd2, "
      "socket, socketpair, connect, bind, listen, accept, accept4, "
      "getsockname, getpeername, getsockopt, setsockopt, "
      "sendto, recvfrom, sendmsg, recvmsg, sendmmsg, recvmmsg, shutdown "
    "} "
  "} "
  "USE codinglemons_run DEFAULT KILL_PROCESS"
