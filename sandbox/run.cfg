# ===========================================================================
# worker2 RUN profile — jail for executing untrusted USER CODE.
#
# Boundary summary (defense in depth):
#   * namespaces: user, net (NO network), pid, mount, ipc, uts
#   * rootfs: tmpfs /, host /usr read-only (toolchain/libs), /tmp tmpfs rw,
#     /proc with sensitive dirs masked, /dev minimal
#   * rlimits + cgroup (memory, pids) bound CPU/mem/procs/fds/file size
#   * seccomp: the allowlist in run.kafel. Unlisted syscalls return ENOSYS,
#     dangerous ones (ptrace, mount, unshare, bpf, ...) kill the process,
#     threads only (fork returns EAGAIN), no sockets.
#
# The executor overrides --rlimit_cpu / --time_limit per run.
# ===========================================================================

name: "codinglemons-run"
description: "Run untrusted user code (seccomp allowlist, threads only)"

mode: ONCE
hostname: "sandbox"
cwd: "/code"

# Wall-clock backstop; the executor overrides it to a second above its watchdog
# (which kills at 2 x CPU limit + 1 s).
time_limit: 60
max_cpus: 1

# --- rlimits (VALUE = use the number; HARD/SOFT would ignore it) ---
# Virtual address space: generous on purpose — the executor's memory watch is the
# real RSS limit; rlimit_as only caps unbacked virtual mappings and too-tight
# a value breaks the JVM's heap+metaspace+stack reservations.
rlimit_as_type: VALUE
rlimit_as: 4096
rlimit_cpu_type: VALUE
rlimit_cpu: 10
rlimit_nofile_type: VALUE
rlimit_nofile: 256
rlimit_fsize_type: VALUE
rlimit_fsize: 64
rlimit_nproc_type: VALUE
rlimit_nproc: 64
rlimit_core_type: VALUE
rlimit_core: 0

# --- cgroups: none here. The executor puts nsjail in a per-jail cgroup
# (memory, cpuacct, pids) itself; see cgroups.py. CPU is bounded by
# max_cpus + rlimit_cpu + the wall backstop.

# --- namespaces ---
clone_newnet: true
iface_no_lo: true               # no loopback either; gVisor rejects bringing lo up (ENOTTY)
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: false          # gVisor rejects CLONE_NEWCGROUP (EINVAL)

# The executor runs as root; map the jail to 65534 outside too, never to root.
uidmap { inside_id: "65534" outside_id: "65534" count: 1 }
gidmap { inside_id: "65534" outside_id: "65534" count: 1 }

# --- filesystem ---
mount { dst: "/" fstype: "tmpfs" rw: false }
mount { src: "/usr" dst: "/usr" is_bind: true nosuid: true rw: false }
mount { src: "/usr/lib" dst: "/lib" is_symlink: true }
mount { src: "/usr/lib64" dst: "/lib64" is_symlink: true }
mount { src: "/usr/lib32" dst: "/lib32" is_symlink: true }
mount { src: "/usr/libx32" dst: "/libx32" is_symlink: true }
mount { src: "/usr/bin" dst: "/bin" is_symlink: true }
mount { src: "/usr/sbin" dst: "/sbin" is_symlink: true }
# The JDK's lib/jvm.cfg and conf/ are symlinks into /etc/java-21-openjdk.
mount { src: "/etc/java-21-openjdk" dst: "/etc/java-21-openjdk" is_bind: true rw: false }
mount { dst: "/proc" fstype: "proc" nosuid: true rw: false }
# Mask /proc dirs that leak host info (tmpfs can only mask dirs, not files).
mount { dst: "/proc/bus" fstype: "tmpfs" rw: false }
mount { dst: "/proc/irq" fstype: "tmpfs" rw: false }
mount { dst: "/proc/sys" fstype: "tmpfs" rw: false }
mount { dst: "/dev" fstype: "tmpfs" nosuid: true rw: false }
mount { dst: "/tmp" fstype: "tmpfs" nosuid: true rw: true }

envar: "PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C.UTF-8"

silent: false
skip_setsid: false
disable_no_new_privs: false

seccomp_policy_file: "/opt/executor/sandbox/run.kafel"
