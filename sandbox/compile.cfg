# ===========================================================================
# worker2 COMPILE profile — jail for running the COMPILER on untrusted source.
#
# Why a separate, looser profile than run.cfg:
#   The compiler is TRUSTED code fed UNTRUSTED input. g++ forks a subprocess
#   tree (cc1plus, as, collect2/ld); javac is one JVM. compile.kafel is run.kafel's
#   allowlist plus process creation (never new namespaces) and the file-mode
#   calls linkers need; the same dangerous syscalls kill the process.
#
# What this profile stops that host-side compilation did NOT:
#   * compile-time file reads:  #include "/etc/passwd" / "/home/.../.env" — the
#     host FS simply isn't in the jail (only /usr toolchain + /code), so there
#     is nothing to read.
#   * compile bombs: deep template/macro expansion can't exhaust host RAM — the
#     per-run cgroup memory.max and CPU time cap bound it.
#   * network: no sockets reach anywhere (empty net namespace).
#
# The worker mounts /code READ-WRITE here (compiler emits the binary/classes);
# run.cfg then mounts it read-only. Worker overrides --rlimit_cpu /
# --time_limit per compile.
# ===========================================================================

name: "codinglemons-compile"
description: "Compile untrusted source (seccomp allowlist, no network, no host FS)"

mode: ONCE
hostname: "sandbox"
cwd: "/code"

time_limit: 60
max_cpus: 1

rlimit_as_type: VALUE
rlimit_as: 8192                  # g++ -O2 maps a lot of virtual; real RSS bounded by cgroup
rlimit_cpu_type: VALUE
rlimit_cpu: 30
rlimit_nofile_type: VALUE
rlimit_nofile: 512               # javac/g++ open many toolchain files
rlimit_fsize_type: VALUE
rlimit_fsize: 256                # compiled artifact size cap (MB)
rlimit_nproc_type: VALUE
rlimit_nproc: 128                # g++ subprocess tree
rlimit_core_type: VALUE
rlimit_core: 0

# cgroups: none here; the executor puts nsjail in a per-jail cgroup (cgroups.py).

clone_newnet: true
iface_no_lo: true               # no loopback either; gVisor rejects bringing lo up (ENOTTY)
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: false          # gVisor rejects CLONE_NEWCGROUP (EINVAL)

# The executor runs as root; map the jail to 65534 outside too, never to root.
uidmap { inside_id: "65534" outside_id: "65534" count: 1 }
gidmap { inside_id: "65534" outside_id: "65534" count: 1 }

mount { dst: "/" fstype: "tmpfs" rw: false }
mount { src: "/usr" dst: "/usr" is_bind: true nosuid: true rw: false }
mount { src: "/usr/lib" dst: "/lib" is_symlink: true }
mount { src: "/usr/lib64" dst: "/lib64" is_symlink: true }
mount { src: "/usr/lib32" dst: "/lib32" is_symlink: true }
mount { src: "/usr/libx32" dst: "/libx32" is_symlink: true }
mount { src: "/usr/bin" dst: "/bin" is_symlink: true }
mount { src: "/usr/sbin" dst: "/sbin" is_symlink: true }
mount { src: "/etc/alternatives" dst: "/etc/alternatives" is_bind: true rw: false }
# The JDK's lib/jvm.cfg and conf/ are symlinks into /etc/java-21-openjdk.
mount { src: "/etc/java-21-openjdk" dst: "/etc/java-21-openjdk" is_bind: true rw: false }
mount { dst: "/proc" fstype: "proc" nosuid: true rw: false }
mount { dst: "/proc/bus" fstype: "tmpfs" rw: false }
mount { dst: "/proc/irq" fstype: "tmpfs" rw: false }
mount { dst: "/proc/sys" fstype: "tmpfs" rw: false }
mount { dst: "/dev" fstype: "tmpfs" nosuid: true rw: false }
mount { dst: "/tmp" fstype: "tmpfs" nosuid: true rw: true }

envar: "PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"
envar: "HOME=/tmp"
envar: "TMPDIR=/tmp"
envar: "LANG=C.UTF-8"

silent: false
skip_setsid: false
disable_no_new_privs: false

seccomp_policy_file: "/opt/executor/sandbox/compile.kafel"
